# The weave suite's own weave: the AXI4 core plus the synthetic API, in one run.
# One run is the simpler flow; two Weave tasks in one image would need init: false
# on each and an svweave.Init after them (sv-weave 0.2).
sv-weave:
  binding: fw_proto_weave:FwProtoBinding
  plugin-path: [../../fw_proto/python]
  # fw_proto_pkg brings fw-hdl, whose fw_root.sv elaborates only under a
  # top: the stub top keeps the weave's elaboration to the packages.
  sources:
    files: [weave_top.sv]
    top: [weave_top]
  weavers:
  - name: fw_proto_weave:FwProtoWeaver
