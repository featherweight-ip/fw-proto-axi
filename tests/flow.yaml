# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# SVUnit suites. Each suite is one image and one run, built only when
# selected: `dfm run tests --tests types`.
fragment:
  name: suites

  tasks:
  - name: svunit
    uses: hdltest.svunit.Lib

  # ---- suite: types (no harness: pure functions of axi4_types_pkg)
  - name: types-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [types_unit_test.sv]

  - name: types-runner
    uses: hdltest.svunit.TestRunner
    needs: [types-tests]

  - name: types-bench
    passthrough: all
    needs: [fw.proto.axi.types, types-runner]

  - name: types-img
    uses: hdlsim.SimImage
    needs: [svunit, types-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: types-run
    uses: hdlsim.SimRun
    needs: [types-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: types
    uses: hdltest.svunit.Check
    needs: [types-run]
    with:
      name: types
    tags:
    - std.Test: {name: types}

  # ---- suite: chk_teeth (axi4_checker standalone, COUNT_ONLY, planted pin
  # faults; no harness, one view)
  - name: chk-teeth-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [chk_teeth_unit_test.sv]

  - name: chk-teeth-runner
    uses: hdltest.svunit.TestRunner
    needs: [chk-teeth-tests]

  - name: chk-teeth-bench
    passthrough: all
    needs: [fw.proto.axi.types, fw.proto.axi.checker, chk-teeth-runner]

  - name: chk-teeth-img
    uses: hdlsim.SimImage
    needs: [svunit, chk-teeth-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: chk-teeth-run
    uses: hdlsim.SimRun
    needs: [chk-teeth-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: chk-teeth
    uses: hdltest.svunit.Check
    needs: [chk-teeth-run]
    with:
      name: chk_teeth
    tags:
    - std.Test: {name: chk_teeth}

  # ---- suites x views. A suite is written against API handles only; a VIEW
  # is the harness that supplies them (tests/env/<view>/). Each (suite,
  # view) cell is one image and one run: `dfm run tests --tests l1_basic`.

  # The envs every suite shares (axi4_test_pkg: L1 env, generators).
  - name: test-env
    uses: std.FileSet
    needs: [fw.proto.axi.class]
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_test_pkg.sv]

  # One harness per (level, view); each defines module axi4_l<N>_harness.
  - name: l1-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l1_harness.sv]
      incdirs: [.]

  - name: l1-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l1_harness.sv]
      incdirs: [.]

  - name: l2-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l2_harness.sv]
      incdirs: [.]

  - name: l2-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l2_harness.sv]
      incdirs: [.]

  - name: mem-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_mem_harness.sv]
      incdirs: [.]

  - name: mem-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_mem_harness.sv]
      incdirs: [.]

  # ---- suite: l1_basic
  - name: l1-basic-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l1_basic_unit_test.sv]

  - name: l1-basic-runner
    uses: hdltest.svunit.TestRunner
    needs: [l1-basic-tests]
    with:
      harness: [axi4_l1_harness]

  # What one view compiles besides SVUnit: its harness (and through it the
  # env and the class layer), then the suite.
  - name: l1-basic-bench-tlm
    passthrough: all
    needs: [l1-harness-tlm, l1-basic-runner]

  - name: l1-basic-bench-xtor
    passthrough: all
    needs: [l1-harness-xtor, l1-basic-runner]

  - name: l1-basic-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l1-basic-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l1-basic-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l1-basic-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  # The view axis is `image`: the project's test runner (hdlsim) reads views
  # from that axis name; the test name comes from the tag on the matrix task.
  - name: l1-basic
    tags:
    - std.Test: {name: l1_basic}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l1-basic-run.${{ this.image }}"]
        with:
          name: "l1_basic-${{ this.image }}"

  # ---- suite: l2_basic
  - name: l2-basic-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_basic_unit_test.sv]

  - name: l2-basic-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-basic-tests]
    with:
      harness: [axi4_l2_harness]

  - name: l2-basic-bench-tlm
    passthrough: all
    needs: [l2-harness-tlm, l2-basic-runner]

  - name: l2-basic-bench-xtor
    passthrough: all
    needs: [l2-harness-xtor, l2-basic-runner]

  - name: l2-basic-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-basic-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-basic-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-basic-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2-basic
    tags:
    - std.Test: {name: l2_basic}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-basic-run.${{ this.image }}"]
        with:
          name: "l2_basic-${{ this.image }}"

  # ---- suite: l2_mem
  - name: l2-mem-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_mem_unit_test.sv]

  - name: l2-mem-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-mem-tests]
    with:
      harness: [axi4_mem_harness]

  - name: l2-mem-bench-tlm
    passthrough: all
    needs: [mem-harness-tlm, l2-mem-runner]

  - name: l2-mem-bench-xtor
    passthrough: all
    needs: [mem-harness-xtor, l2-mem-runner]

  - name: l2-mem-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-mem-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-mem-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-mem-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2-mem
    tags:
    - std.Test: {name: l2_mem}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-mem-run.${{ this.image }}"]
        with:
          name: "l2_mem-${{ this.image }}"
