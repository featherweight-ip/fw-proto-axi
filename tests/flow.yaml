# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# SVUnit suites. Each suite is one image and one run, built only when
# selected: `dfm run tests --tests types`.
fragment:
  name: suites

  tasks:
  - name: svunit
    uses: hdltest.svunit.Lib

  # ---- suite: types (no harness: pure functions of axi4_types_pkg)
  - name: types-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [types_unit_test.sv]

  - name: types-runner
    uses: hdltest.svunit.TestRunner
    needs: [types-tests]

  - name: types-bench
    passthrough: all
    needs: [fw.proto.axi.types, types-runner]

  - name: types-img
    uses: hdlsim.SimImage
    needs: [svunit, types-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: types-run
    uses: hdlsim.SimRun
    needs: [types-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: types
    uses: hdltest.svunit.Check
    needs: [types-run]
    with:
      name: types
    tags:
    - std.Test: {name: types}

  # ---- suite: chk_teeth (axi4_checker standalone, COUNT_ONLY, planted pin
  # faults; no harness, one view)
  - name: chk-teeth-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [chk_teeth_unit_test.sv]

  - name: chk-teeth-runner
    uses: hdltest.svunit.TestRunner
    needs: [chk-teeth-tests]

  - name: chk-teeth-bench
    passthrough: all
    needs: [fw.proto.axi.types, fw.proto.axi.checker, chk-teeth-runner]

  - name: chk-teeth-img
    uses: hdlsim.SimImage
    needs: [svunit, chk-teeth-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: chk-teeth-run
    uses: hdlsim.SimRun
    needs: [chk-teeth-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: chk-teeth
    uses: hdltest.svunit.Check
    needs: [chk-teeth-run]
    with:
      name: chk_teeth
    tags:
    - std.Test: {name: chk_teeth}

  # ---- suite: rules_pins_ns (plan P7): chk_teeth's pin sequences watched by the
  # checker and by the pin monitor with the AXI4 rules; the verdicts must agree.
  - name: rules-pins-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [rules_pins_ns_unit_test.sv]

  - name: rules-pins-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [rules-pins-ns-tests]

  - name: rules-pins-ns-bench
    passthrough: all
    needs: [fw.proto.axi.types, fw.proto.axi.checker, fw.proto.axi.rules-xtor, rules-pins-ns-runner]

  - name: rules-pins-ns-img
    uses: hdlsim.SimImage
    needs: [svunit, rules-pins-ns-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: rules-pins-ns-run
    uses: hdlsim.SimRun
    needs: [rules-pins-ns-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: rules-pins-ns
    uses: hdltest.svunit.Check
    needs: [rules-pins-ns-run]
    with:
      name: rules_pins_ns
    tags:
    - std.Test: {name: rules_pins_ns}

  # ---- suite: weave_ns (new style: the classes fw_proto derives from the
  # AXI4 core and from a synthetic API, over P_MIN/P_DEF/P_WIDE; no harness)
  - name: weave-synth-src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: weave/synth
      include: [weave_synth_pkg.sv]

  # One weave over the core and the synthetic API (tests/weave/sv-weave.yaml).
  - name: weave-ns-woven
    uses: svweave.Weave
    needs: [fw.proto.axi.core, weave-synth-src]
    with:
      config: weave/sv-weave.yaml

  - name: test-params
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_test_params_pkg.sv]

  - name: weave-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [weave_ns_unit_test.sv]

  - name: weave-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [weave-ns-tests]

  - name: weave-ns-bench
    passthrough: all
    needs: [weave-ns-woven, test-params, weave-ns-runner]

  - name: weave-ns-img
    uses: hdlsim.SimImage
    needs: [svunit, weave-ns-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: weave-ns-run
    uses: hdlsim.SimRun
    needs: [weave-ns-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: weave-ns
    uses: hdltest.svunit.Check
    needs: [weave-ns-run]
    with:
      name: weave_ns
    tags:
    - std.Test: {name: weave_ns}

  # ---- suite: rv_pilot (plan P1): the fw-proto weaver on fw-hdl's ready/valid
  # APIs. fw-hdl's tests/rv_proto runs twice -- as is, and with its sink's
  # `FW_RV_TARGET_IMP replaced by the generated fw_rv_target_if_imp
  # (tests/rv_pilot) -- and the two sink transcripts must be identical.
  - name: rv-pilot-woven
    uses: svweave.Weave
    needs: [fw-hdl.hdl.sv-src, fw-hdl.hdl.rv-src]
    with:
      config: weave/rv/sv-weave.yaml

  - name: rv-pilot-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: rv_pilot
      include: [rv_proto_pkg.sv]
      incdirs: [., ../../packages/fw-hdl/tests/rv_proto]

  - name: rv-proto-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../packages/fw-hdl/tests/rv_proto
      include: [rv_proto_tb.sv]
      incdirs: [.]

  - name: rv-orig-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../packages/fw-hdl/tests/rv_proto
      include: [rv_proto_pkg.sv]
      incdirs: [.]

  - name: rv-pilot-img
    uses: hdlsim.SimImage
    needs: [rv-pilot-woven, rv-pilot-tb, rv-proto-tb, flags-img]
    with:
      sim: "${{ sim }}"
      top: [rv_proto_tb]

  - name: rv-orig-img
    uses: hdlsim.SimImage
    needs: [fw-hdl.hdl.sv-src, fw-hdl.hdl.rv-src, rv-orig-pkg, rv-proto-tb, flags-img]
    with:
      sim: "${{ sim }}"
      top: [rv_proto_tb]

  - name: rv-pilot-run
    uses: hdlsim.SimRun
    needs: [rv-pilot-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"

  - name: rv-orig-run
    uses: hdlsim.SimRun
    needs: [rv-orig-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"

  - name: rv-pilot
    needs: [rv-pilot-run, rv-orig-run]
    shell: bash
    run: |
      # Reports an hdlsim.TestResult, as hdltest.svunit.Check does, so the
      # `tests` summary counts it.
      result() {
        dfm-out item --type hdlsim.TestResult name=rv_pilot src=rv_pilot testname=rv_pilot \
          status=$1 passed:=$2 errors:=$3 warnings:=0 fatals:=0 run_status:=0
      }
      fail() { echo "rv_pilot: $1"; result fail false 1; exit 1; }
      d=$(dirname "$TASK_RUNDIR")
      p=$d/fw.proto.axi.suites.rv-pilot-run/sim.log
      o=$d/fw.proto.axi.suites.rv-orig-run/sim.log
      grep -q "\[rv_proto\] PASS" "$p" || fail "pilot run did not pass"
      grep -q "\[rv_proto\] PASS" "$o" || fail "original run did not pass"
      grep "^\[sink\]" "$p" > pilot.txt || true
      grep "^\[sink\]" "$o" > orig.txt || true
      test -s orig.txt || fail "no sink lines"
      diff orig.txt pilot.txt || fail "sink transcripts differ"
      echo "rv_pilot: PASS ($(wc -l < pilot.txt) sink beats, identical)"
      result pass true 0
    tags:
    - std.Test: {name: rv_pilot}

  # ---- suite: types_ns (new style: the core's burst helpers; plan P2)
  - name: types-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [types_ns_unit_test.sv]

  - name: types-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [types-ns-tests]

  - name: types-ns-bench
    passthrough: all
    needs: [fw.proto.axi.core, types-ns-runner]

  - name: types-ns-img
    uses: hdlsim.SimImage
    needs: [svunit, types-ns-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: types-ns-run
    uses: hdlsim.SimRun
    needs: [types-ns-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: types-ns
    uses: hdltest.svunit.Check
    needs: [types-ns-run]
    with:
      name: types_ns
    tags:
    - std.Test: {name: types_ns}

  # ---- suite: bundle_ns (new style: what fw_proto derives from axi4_bundle:
  # field tables, role ports, inboxes, payload helpers, tlm link; plan P3)
  - name: bundle-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [bundle_ns_unit_test.sv]

  - name: bundle-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [bundle-ns-tests]

  - name: bundle-ns-bench
    passthrough: all
    needs: [weave-ns-woven, test-params, bundle-ns-runner]

  - name: bundle-ns-img
    uses: hdlsim.SimImage
    needs: [svunit, bundle-ns-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: bundle-ns-run
    uses: hdlsim.SimRun
    needs: [bundle-ns-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: bundle-ns
    uses: hdltest.svunit.Check
    needs: [bundle-ns-run]
    with:
      name: bundle_ns
    tags:
    - std.Test: {name: bundle_ns}

  # ---- suite: xtor_ns (plan P4.2): the generated transactors and bridges back
  # to back, one link per P, axi4_checker (COUNT_ONLY) on each.
  - name: xtor-ns-env
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_xtor_ns_b2b.sv]

  - name: xtor-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [xtor_ns_unit_test.sv]

  - name: xtor-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [xtor-ns-tests]

  - name: xtor-ns-bench
    passthrough: all
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.rules-xtor, fw.proto.axi.checker, test-params,
            xtor-ns-env, xtor-ns-runner]

  - name: xtor-ns-img
    uses: hdlsim.SimImage
    needs: [svunit, xtor-ns-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: xtor-ns-run
    uses: hdlsim.SimRun
    needs: [xtor-ns-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: xtor-ns
    uses: hdltest.svunit.Check
    needs: [xtor-ns-run]
    with:
      name: xtor_ns
    tags:
    - std.Test: {name: xtor_ns}

  # ---- suite: l1_ns (plan P4.3): l1_basic on the new channel API, each view
  # x three P. A view is the axi4_l1_ns_link module the image compiles
  # (env/<view>/axi4_l1_ns_link.sv); the suite and the cells are shared.
  - name: l1-ns-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l1_ns_cell.sv]

  - name: l1-ns-link-tlm
    uses: std.FileSet
    needs: [fw.proto.axi.woven]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l1_ns_link.sv]

  - name: l1-ns-link-xtor
    uses: std.FileSet
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.checker, fw.proto.axi.cores]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l1_ns_link.sv]

  - name: l1-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l1_ns_unit_test.sv]

  - name: l1-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [l1-ns-tests]

  - name: l1-ns-bench-tlm
    passthrough: all
    needs: [l1-ns-link-tlm, fw.proto.axi.rules, test-params, l1-ns-cell, l1-ns-runner]

  - name: l1-ns-bench-xtor
    passthrough: all
    needs: [l1-ns-link-xtor, fw.proto.axi.rules-xtor, test-params, l1-ns-cell, l1-ns-runner]

  - name: l1-ns-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l1-ns-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l1-ns-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l1-ns-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l1-ns
    tags:
    - std.Test: {name: l1_ns}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l1-ns-run.${{ this.image }}"]
        with:
          name: "l1_ns-${{ this.image }}"

  # ---- suite: l2_ns (plan P5): l2_basic on the transaction API through the adapters, each view x three P, over the
  # L1 link of the view (env/<view>/axi4_l1_ns_link.sv) and axi4_l2_ns_env.
  - name: l2-ns-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l2_ns_pkg.sv, axi4_l2_ns_env.sv, axi4_l2_ns_cell.sv]

  - name: l2-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_ns_unit_test.sv]

  - name: l2-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-ns-tests]

  - name: l2-ns-bench-tlm
    passthrough: all
    needs: [l1-ns-link-tlm, fw.proto.axi.behav, fw.proto.axi.rules, test-params, l2-ns-cell, l2-ns-runner]

  - name: l2-ns-bench-xtor
    passthrough: all
    needs: [l1-ns-link-xtor, fw.proto.axi.behav-xtor, fw.proto.axi.rules-xtor, test-params, l2-ns-cell, l2-ns-runner]

  - name: l2-ns-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-ns-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-ns-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-ns-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2-ns
    tags:
    - std.Test: {name: l2_ns}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-ns-run.${{ this.image }}"]
        with:
          name: "l2_ns-${{ this.image }}"

  # ---- suite: l2_mem_ns (plan P5): l2_mem: the memory model and fw_mem_if through the adapters, each view x three P, over the
  # L1 link of the view (env/<view>/axi4_l1_ns_link.sv) and axi4_l2_ns_env.
  - name: l2-mem-ns-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l2_ns_pkg.sv, axi4_l2_ns_env.sv, axi4_l2_mem_ns_cell.sv]

  - name: l2-mem-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_mem_ns_unit_test.sv]

  - name: l2-mem-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-mem-ns-tests]

  - name: l2-mem-ns-bench-tlm
    passthrough: all
    needs: [l1-ns-link-tlm, fw.proto.axi.behav, fw.proto.axi.rules, test-params, l2-mem-ns-cell, l2-mem-ns-runner]

  - name: l2-mem-ns-bench-xtor
    passthrough: all
    needs: [l1-ns-link-xtor, fw.proto.axi.behav-xtor, fw.proto.axi.rules-xtor, test-params, l2-mem-ns-cell, l2-mem-ns-runner]

  - name: l2-mem-ns-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-mem-ns-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-mem-ns-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-mem-ns-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2-mem-ns
    tags:
    - std.Test: {name: l2_mem_ns}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-mem-ns-run.${{ this.image }}"]
        with:
          name: "l2_mem_ns-${{ this.image }}"

  # ---- suite: rules_teeth_ns (plan P7, the port of chk_teeth): one planted bug
  # per case over the L1 link, from a misbehaving model or the manager; exactly
  # its rule must fire, and with pins the link's axi4_checker must agree.
  - name: rules-teeth-ns-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_rules_teeth_cell.sv]

  - name: rules-teeth-ns-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [rules_teeth_ns_unit_test.sv]

  - name: rules-teeth-ns-runner
    uses: hdltest.svunit.TestRunner
    needs: [rules-teeth-ns-tests]

  - name: rules-teeth-ns-bench-tlm
    passthrough: all
    needs: [l1-ns-link-tlm, fw.proto.axi.rules, test-params, rules-teeth-ns-cell, rules-teeth-ns-runner]

  - name: rules-teeth-ns-bench-xtor
    passthrough: all
    needs: [l1-ns-link-xtor, fw.proto.axi.rules-xtor, test-params, rules-teeth-ns-cell, rules-teeth-ns-runner]

  - name: rules-teeth-ns-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "rules-teeth-ns-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: rules-teeth-ns-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["rules-teeth-ns-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: rules-teeth-ns
    tags:
    - std.Test: {name: rules_teeth_ns}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["rules-teeth-ns-run.${{ this.image }}"]
        with:
          name: "rules_teeth_ns-${{ this.image }}"

  # ---- suites x views. A suite is written against API handles only; a VIEW
  # is the harness that supplies them (tests/env/<view>/). Each (suite,
  # view) cell is one image and one run: `dfm run tests --tests l1_basic`.

  # The envs every suite shares (axi4_test_pkg: L1 env, generators).
  - name: test-env
    uses: std.FileSet
    needs: [fw.proto.axi.class]
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_test_pkg.sv]

  # One harness per (level, view); each defines module axi4_l<N>_harness.
  - name: l1-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l1_harness.sv]
      incdirs: [.]

  - name: l1-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l1_harness.sv]
      incdirs: [.]

  - name: l2-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l2_harness.sv]
      incdirs: [.]

  - name: l2-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l2_harness.sv]
      incdirs: [.]

  - name: mem-harness-tlm
    uses: std.FileSet
    needs: [test-env]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_mem_harness.sv]
      incdirs: [.]

  - name: mem-harness-xtor
    uses: std.FileSet
    needs: [test-env, fw.proto.axi.xtor-class, fw.proto.axi.checker]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_mem_harness.sv]
      incdirs: [.]

  # ---- suite: l1_basic
  - name: l1-basic-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l1_basic_unit_test.sv]

  - name: l1-basic-runner
    uses: hdltest.svunit.TestRunner
    needs: [l1-basic-tests]
    with:
      harness: [axi4_l1_harness]

  # What one view compiles besides SVUnit: its harness (and through it the
  # env and the class layer), then the suite.
  - name: l1-basic-bench-tlm
    passthrough: all
    needs: [l1-harness-tlm, l1-basic-runner]

  - name: l1-basic-bench-xtor
    passthrough: all
    needs: [l1-harness-xtor, l1-basic-runner]

  - name: l1-basic-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l1-basic-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l1-basic-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l1-basic-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  # The view axis is `image`: the project's test runner (hdlsim) reads views
  # from that axis name; the test name comes from the tag on the matrix task.
  - name: l1-basic
    tags:
    - std.Test: {name: l1_basic}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l1-basic-run.${{ this.image }}"]
        with:
          name: "l1_basic-${{ this.image }}"

