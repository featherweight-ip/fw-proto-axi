# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# SVUnit suites. Each suite is one image and one run, built only when
# selected: `dfm run tests --tests types`.
fragment:
  name: suites

  tasks:
  - name: svunit
    uses: hdltest.svunit.Lib

  # ---- suite: rules_pins (plan P7): scripted pin sequences watched by the
  # checker and by the pin monitor with the AXI4 rules; the verdicts must agree.
  - name: rules-pins-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [rules_pins_unit_test.sv]

  - name: rules-pins-runner
    uses: hdltest.svunit.TestRunner
    needs: [rules-pins-tests]

  - name: rules-pins-bench
    passthrough: all
    needs: [fw.proto.axi.checker, fw.proto.axi.rules-xtor, rules-pins-runner]

  - name: rules-pins-img
    uses: hdlsim.SimImage
    needs: [svunit, rules-pins-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: rules-pins-run
    uses: hdlsim.SimRun
    needs: [rules-pins-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: rules-pins
    uses: hdltest.svunit.Check
    needs: [rules-pins-run]
    with:
      name: rules_pins
    tags:
    - std.Test: {name: rules_pins}

  # ---- suite: weave (the classes fw_proto derives from the
  # AXI4 core and from a synthetic API, over P_MIN/P_DEF/P_WIDE; no harness)
  - name: weave-synth-src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: weave/synth
      include: [weave_synth_pkg.sv]

  # One weave over the core and the synthetic API (tests/weave/sv-weave.yaml).
  - name: weave-woven
    uses: svweave.Weave
    needs: [fw.proto.axi.core, weave-synth-src]
    with:
      config: weave/sv-weave.yaml

  - name: test-params
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_test_params_pkg.sv]

  - name: weave-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [weave_unit_test.sv]

  - name: weave-runner
    uses: hdltest.svunit.TestRunner
    needs: [weave-tests]

  - name: weave-bench
    passthrough: all
    needs: [weave-woven, test-params, weave-runner]

  - name: weave-img
    uses: hdlsim.SimImage
    needs: [svunit, weave-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: weave-run
    uses: hdlsim.SimRun
    needs: [weave-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: weave
    uses: hdltest.svunit.Check
    needs: [weave-run]
    with:
      name: weave
    tags:
    - std.Test: {name: weave}

  # ---- suite: rv_pilot (plan P1): the fw-proto weaver on fw-hdl's ready/valid
  # APIs. fw-hdl's tests/rv_proto runs twice -- as is, and with its sink's
  # `FW_RV_TARGET_IMP replaced by the generated fw_rv_target_if_imp
  # (tests/rv_pilot) -- and the two sink transcripts must be identical.
  - name: rv-pilot-woven
    uses: svweave.Weave
    needs: [fw-hdl.hdl.sv-src, fw-hdl.hdl.rv-src]
    with:
      config: weave/rv/sv-weave.yaml

  - name: rv-pilot-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: rv_pilot
      include: [rv_proto_pkg.sv]
      incdirs: [., ../../packages/fw-hdl/tests/rv_proto]

  - name: rv-proto-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../packages/fw-hdl/tests/rv_proto
      include: [rv_proto_tb.sv]
      incdirs: [.]

  - name: rv-orig-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: ../packages/fw-hdl/tests/rv_proto
      include: [rv_proto_pkg.sv]
      incdirs: [.]

  - name: rv-pilot-img
    uses: hdlsim.SimImage
    needs: [rv-pilot-woven, rv-pilot-tb, rv-proto-tb, flags-img]
    with:
      sim: "${{ sim }}"
      top: [rv_proto_tb]

  - name: rv-orig-img
    uses: hdlsim.SimImage
    needs: [fw-hdl.hdl.sv-src, fw-hdl.hdl.rv-src, rv-orig-pkg, rv-proto-tb, flags-img]
    with:
      sim: "${{ sim }}"
      top: [rv_proto_tb]

  - name: rv-pilot-run
    uses: hdlsim.SimRun
    needs: [rv-pilot-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"

  - name: rv-orig-run
    uses: hdlsim.SimRun
    needs: [rv-orig-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"

  - name: rv-pilot
    needs: [rv-pilot-run, rv-orig-run]
    shell: bash
    run: |
      # Reports an hdlsim.TestResult, as hdltest.svunit.Check does, so the
      # `tests` summary counts it.
      result() {
        dfm-out item --type hdlsim.TestResult name=rv_pilot src=rv_pilot testname=rv_pilot \
          status=$1 passed:=$2 errors:=$3 warnings:=0 fatals:=0 run_status:=0
      }
      fail() { echo "rv_pilot: $1"; result fail false 1; exit 1; }
      d=$(dirname "$TASK_RUNDIR")
      p=$d/fw.proto.axi.suites.rv-pilot-run/sim.log
      o=$d/fw.proto.axi.suites.rv-orig-run/sim.log
      grep -q "\[rv_proto\] PASS" "$p" || fail "pilot run did not pass"
      grep -q "\[rv_proto\] PASS" "$o" || fail "original run did not pass"
      grep "^\[sink\]" "$p" > pilot.txt || true
      grep "^\[sink\]" "$o" > orig.txt || true
      test -s orig.txt || fail "no sink lines"
      diff orig.txt pilot.txt || fail "sink transcripts differ"
      echo "rv_pilot: PASS ($(wc -l < pilot.txt) sink beats, identical)"
      result pass true 0
    tags:
    - std.Test: {name: rv_pilot}

  # ---- suite: types (the core's burst helpers; plan P2)
  - name: types-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [types_unit_test.sv]

  - name: types-runner
    uses: hdltest.svunit.TestRunner
    needs: [types-tests]

  - name: types-bench
    passthrough: all
    needs: [fw.proto.axi.core, types-runner]

  - name: types-img
    uses: hdlsim.SimImage
    needs: [svunit, types-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: types-run
    uses: hdlsim.SimRun
    needs: [types-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: types
    uses: hdltest.svunit.Check
    needs: [types-run]
    with:
      name: types
    tags:
    - std.Test: {name: types}

  # ---- suite: bundle (what fw_proto derives from axi4_bundle:
  # field tables, role ports, inboxes, payload helpers, tlm link; plan P3)
  - name: bundle-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [bundle_unit_test.sv]

  - name: bundle-runner
    uses: hdltest.svunit.TestRunner
    needs: [bundle-tests]

  - name: bundle-bench
    passthrough: all
    needs: [weave-woven, test-params, bundle-runner]

  - name: bundle-img
    uses: hdlsim.SimImage
    needs: [svunit, bundle-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: bundle-run
    uses: hdlsim.SimRun
    needs: [bundle-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: bundle
    uses: hdltest.svunit.Check
    needs: [bundle-run]
    with:
      name: bundle
    tags:
    - std.Test: {name: bundle}

  # ---- suite: xtor (plan P4.2): the generated transactors and bridges back
  # to back, one link per P, axi4_checker (COUNT_ONLY) on each.
  - name: xtor-env
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_xtor_b2b.sv]

  - name: xtor-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [xtor_unit_test.sv]

  - name: xtor-runner
    uses: hdltest.svunit.TestRunner
    needs: [xtor-tests]

  - name: xtor-bench
    passthrough: all
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.rules-xtor, fw.proto.axi.checker, test-params,
            xtor-env, xtor-runner]

  - name: xtor-img
    uses: hdlsim.SimImage
    needs: [svunit, xtor-bench, flags-img]
    with:
      sim: "${{ sim }}"
      top: [testrunner]

  - name: xtor-run
    uses: hdlsim.SimRun
    needs: [xtor-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: xtor
    uses: hdltest.svunit.Check
    needs: [xtor-run]
    with:
      name: xtor
    tags:
    - std.Test: {name: xtor}

  # ---- suite: l1 (plan P4.3): the channel contract on the channel API, each view
  # x three P. A view is the axi4_l1_link module the image compiles
  # (env/<view>/axi4_l1_link.sv); the suite and the cells are shared.
  - name: l1-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l1_cell.sv]

  - name: l1-link-tlm
    uses: std.FileSet
    needs: [fw.proto.axi.woven]
    with:
      type: systemVerilogSource
      base: env/tlm
      include: [axi4_l1_link.sv]

  - name: l1-link-xtor
    uses: std.FileSet
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.checker, fw.proto.axi.slice]
    with:
      type: systemVerilogSource
      base: env/xtor
      include: [axi4_l1_link.sv]

  - name: l1-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l1_unit_test.sv]

  - name: l1-runner
    uses: hdltest.svunit.TestRunner
    needs: [l1-tests]

  - name: l1-bench-tlm
    passthrough: all
    needs: [l1-link-tlm, fw.proto.axi.rules, test-params, l1-cell, l1-runner]

  - name: l1-bench-xtor
    passthrough: all
    needs: [l1-link-xtor, fw.proto.axi.rules-xtor, test-params, l1-cell, l1-runner]

  - name: l1-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l1-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l1-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l1-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l1
    tags:
    - std.Test: {name: l1}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l1-run.${{ this.image }}"]
        with:
          name: "l1-${{ this.image }}"

  # ---- suite: l2 (plan P5): whole transactions on the transaction API through the adapters, each view x three P, over the
  # L1 link of the view (env/<view>/axi4_l1_link.sv) and axi4_l2_env.
  - name: l2-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l2_pkg.sv, axi4_l2_env.sv, axi4_l2_cell.sv]

  - name: l2-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_unit_test.sv]

  - name: l2-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-tests]

  - name: l2-bench-tlm
    passthrough: all
    needs: [l1-link-tlm, fw.proto.axi.behav, fw.proto.axi.rules, test-params, l2-cell, l2-runner]

  - name: l2-bench-xtor
    passthrough: all
    needs: [l1-link-xtor, fw.proto.axi.behav-xtor, fw.proto.axi.rules-xtor, test-params, l2-cell, l2-runner]

  - name: l2-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2
    tags:
    - std.Test: {name: l2}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-run.${{ this.image }}"]
        with:
          name: "l2-${{ this.image }}"

  # ---- suite: l2_mem (plan P5): the memory model and fw_mem_if through the adapters, each view x three P, over the
  # L1 link of the view (env/<view>/axi4_l1_link.sv) and axi4_l2_env.
  - name: l2-mem-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_l2_pkg.sv, axi4_l2_env.sv, axi4_l2_mem_cell.sv]

  - name: l2-mem-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [l2_mem_unit_test.sv]

  - name: l2-mem-runner
    uses: hdltest.svunit.TestRunner
    needs: [l2-mem-tests]

  - name: l2-mem-bench-tlm
    passthrough: all
    needs: [l1-link-tlm, fw.proto.axi.behav, fw.proto.axi.rules, test-params, l2-mem-cell, l2-mem-runner]

  - name: l2-mem-bench-xtor
    passthrough: all
    needs: [l1-link-xtor, fw.proto.axi.behav-xtor, fw.proto.axi.rules-xtor, test-params, l2-mem-cell, l2-mem-runner]

  - name: l2-mem-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "l2-mem-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: l2-mem-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["l2-mem-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: l2-mem
    tags:
    - std.Test: {name: l2_mem}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["l2-mem-run.${{ this.image }}"]
        with:
          name: "l2_mem-${{ this.image }}"

  # ---- suite: rules_teeth (plan P7): one planted bug
  # per case over the L1 link, from a misbehaving model or the manager; exactly
  # its rule must fire, and with pins the link's axi4_checker must agree.
  - name: rules-teeth-cell
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: env
      include: [axi4_rules_teeth_cell.sv]

  - name: rules-teeth-tests
    uses: std.FileSet
    with:
      type: svunitTest
      base: unit
      include: [rules_teeth_unit_test.sv]

  - name: rules-teeth-runner
    uses: hdltest.svunit.TestRunner
    needs: [rules-teeth-tests]

  - name: rules-teeth-bench-tlm
    passthrough: all
    needs: [l1-link-tlm, fw.proto.axi.rules, test-params, rules-teeth-cell, rules-teeth-runner]

  - name: rules-teeth-bench-xtor
    passthrough: all
    needs: [l1-link-xtor, fw.proto.axi.rules-xtor, test-params, rules-teeth-cell, rules-teeth-runner]

  - name: rules-teeth-img
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimImage
        needs: [svunit, "rules-teeth-bench-${{ this.view }}", flags-img]
        with:
          sim: "${{ sim }}"
          top: [testrunner]

  - name: rules-teeth-run
    strategy:
      select:
        axes:
          view: [tlm, xtor]
      body:
      - uses: hdlsim.SimRun
        needs: ["rules-teeth-img.${{ this.view }}", "flags-run-${{ build }}"]
        with:
          sim: "${{ sim }}"
          mode: test

  - name: rules-teeth
    tags:
    - std.Test: {name: rules_teeth}
    strategy:
      matrix:
        image: [tlm, xtor]
      body:
      - name: "${{ this.image }}"
        uses: hdltest.svunit.Check
        needs: ["rules-teeth-run.${{ this.image }}"]
        with:
          name: "rules_teeth-${{ this.image }}"
