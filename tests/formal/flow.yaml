# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# Formal checks of the pin checker, the register slice and the generated
# transactor cores.
#   dfm run fv-cover    reachability of legal AXI4 behaviour under the
#                       checker's rules, all assumed (axi4_checker_fv.sv; they
#                       are not vacuous), and of the back-to-back generated
#                       cores (axi4_fv.sv, FV_COVER)
#   dfm run fv          BMC of the back-to-back generated cores (axi4_fv.sv)
#   dfm run fv-teeth    planted bugs (slice, checker; generated cores) must
#                       each be caught (teeth.sh; fv_b2b.sh teeth)
#   dfm run fv-prove    unbounded proof of axi4_slice (axi4_slice_fv.sv)
fragment:
  name: formal

  tasks:
  - name: checker-sv2v
    uptodate: false
    shell: bash
    run: |
      set -e
      OUT="$TASK_RUNDIR/axi4_checker_fv.v"
      sv2v --exclude=Assert -DFORMAL \
        "${{ rootdir }}/src/core/fw_proto_axi4_defs_pkg.sv" \
        "${{ rootdir }}/src/checker/axi4_checker.sv" \
        "${{ rootdir }}/tests/formal/axi4_checker_fv.sv" > "$OUT"
      dfm-out fileset --filetype verilogSource --basedir "$TASK_RUNDIR" axi4_checker_fv.v

  - name: checker-cover
    uses: formal.sby.Cover
    needs: [checker-sv2v]
    with:
      top: axi4_checker_fv
      depth: 24

  # formal.sby has no prove mode; run_sby.sh is the same SymbiYosys run.
  # Also covers the slice's full-occupancy case (FV_COVER) so the proof is
  # not vacuous.
  - name: prove
    uptodate: false
    shell: bash
    run: |
      set -e
      FV_TOP=axi4_slice_fv FV_ENGINE="abc pdr" "${{ rootdir }}/tests/formal/run_sby.sh" prove 8 "$TASK_RUNDIR"
      FV_TOP=axi4_slice_fv FV_DEFINES=-DFV_COVER "${{ rootdir }}/tests/formal/run_sby.sh" cover 8 "$TASK_RUNDIR"

  - name: teeth
    uptodate: false
    shell: bash
    run: |
      set -e
      "${{ rootdir }}/tests/formal/teeth.sh" "$TASK_RUNDIR"

  # The generated transactors' cores back to back (tests/formal/axi4_fv.sv):
  # axi4_mgr_xtor_core -> pins -> axi4_sub_xtor_core, checkers on both user
  # sides and the pins. fv_b2b.sh takes the class-free RTL from the woven-xtor weave.
  - name: bmc
    uptodate: false
    needs: [fw.proto.axi.woven-xtor, fw-hdl.hdl.rv-src]
    shell: bash
    run: |
      set -e
      "${{ rootdir }}/tests/formal/fv_b2b.sh" bmc 16 "$TASK_RUNDIR"

  - name: cover-b2b
    uptodate: false
    needs: [fw.proto.axi.woven-xtor, fw-hdl.hdl.rv-src]
    shell: bash
    run: |
      set -e
      "${{ rootdir }}/tests/formal/fv_b2b.sh" cover 16 "$TASK_RUNDIR"

  # Planted bugs in copies of the generated cores and fw-hdl's rv core: each
  # BMC must fail.
  - name: teeth-gen
    uptodate: false
    needs: [fw.proto.axi.woven-xtor, fw-hdl.hdl.rv-src]
    shell: bash
    run: |
      set -e
      "${{ rootdir }}/tests/formal/fv_b2b.sh" teeth 10 "$TASK_RUNDIR"
