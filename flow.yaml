# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
package:
  name: fw.proto.axi

  # The methodology-neutral DV archetype (dv-flow-libproject): the same verbs
  # as every project built this way -- `dfm run tests`, `smoke`, `lint-rtl`,
  # `tests-info`, `--sim`, `--build` -- with this file filling its slots.
  uses: project.dv

  # IVPM-generated map: resolves imports by name under packages/.
  package-map: packages/dv-flow-package-map.yaml

  imports:
  - project.dv
  - hdlsim
  - hdltest.svunit
  - hdllint
  - formal.sby
  - fw-hdl
  - svweave

  fragments:
  - fw_proto/flow.yaml
  - src/flow.yaml
  - tests/flow.yaml
  - tests/formal/flow.yaml

  tasks:
  # Synthesizable sources: types, checker, cores (transactors later).
  - override: src-rtl
    needs: [types, checker, cores, xtor-sv]

  - override: lint-rtl
    needs: [lint, lint-xtor-ns]

  # Verilator lint over everything synthesizable, elaborated from a lint top
  # (tests/lint). Our own code: held to ZERO findings -- no baseline. A
  # waiver needs a reason written next to it in lint-waivers.yaml.
  - name: lint-top
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: tests/lint
      include: [axi4_lint_top.sv, axi4_lint_b2b.sv, axi4_lint_xtor.sv]

  - name: lint
    uses: hdllint.Rtl
    needs: [src-rtl, lint-top]
    with:
      top: [axi4_lint_top]
      waivers: lint-waivers.yaml

  # The generated transactors (woven-xtor) for the three test P, with their
  # bridges and the behavioural classes (hence --timing: the class side is linted too). Zero findings in
  # this repo's and the generated files; fw-hdl's rv kit is waived by path in
  # lint-waivers-xtor-ns.yaml (it is linted by fw-hdl).
  - name: lint-xtor-ns-top
    uses: std.FileSet
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.behav-xtor, suites.test-params]
    with:
      type: systemVerilogSource
      base: tests/lint
      include: [axi4_lint_xtor_ns.sv, axi4_lint_xtor_ns_b2b.sv]

  - name: lint-xtor-ns
    uses: hdllint.Rtl
    needs: [lint-xtor-ns-top]
    with:
      tools: [vlt]
      top: [axi4_lint_xtor_ns]
      args: [--timing]
      fail_on: any
      waivers: lint-waivers-xtor-ns.yaml

  # Every suite in every view: `dfm run tests --tests types`.
  - override: tests
    needs: [suites.types, suites.chk-teeth, suites.l1-basic, suites.l2-basic, suites.l2-mem,
            suites.types-ns, suites.weave-ns, suites.bundle-ns, suites.rv-pilot,
            suites.xtor-ns, suites.l1-ns, suites.l2-ns, suites.l2-mem-ns]

  # What CI runs on every commit.
  - override: smoke
    needs: [suites.types, suites.chk-teeth, suites.l1-basic, suites.l2-basic, suites.l2-mem]

  # Formal (tests/formal/flow.yaml).
  - root: fv
    desc: Back-to-back formal BMC of the manager and subordinate cores (old and generated)
    needs: [formal.bmc, formal.bmc-ns]
  - root: fv-prove
    desc: Unbounded proof of the cores' register slice (abc pdr)
    needs: [formal.prove]
  - root: fv-cover
    desc: Reachability of legal AXI4 behaviour under the pin checker's rules
    needs: [formal.checker-cover, formal.cover-b2b, formal.cover-b2b-ns]
  - root: fv-teeth
    desc: Planted bugs in slice, cores (old and generated) and checker must each fail formal
    needs: [formal.teeth, formal.teeth-ns]
