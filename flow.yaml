# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
package:
  name: fw.proto.axi

  # The methodology-neutral DV archetype (dv-flow-libproject): the same verbs
  # as every project built this way -- `dfm run tests`, `smoke`, `lint-rtl`,
  # `tests-info`, `--sim`, `--build` -- with this file filling its slots.
  uses: project.dv

  # IVPM-generated map: resolves imports by name under packages/.
  package-map: packages/dv-flow-package-map.yaml

  imports:
  - project.dv
  - hdlsim
  - hdltest.svunit
  - hdllint
  - formal.sby
  - fw-hdl
  - svweave

  fragments:
  - fw_proto/flow.yaml
  - src/flow.yaml
  - tests/flow.yaml
  - tests/formal/flow.yaml
  - tests/ip/flow.yaml

  tasks:
  # Synthesizable sources: the pin checker (with the defs package) and the
  # register slice. The generated transactors are linted by lint-xtor.
  - override: src-rtl
    needs: [checker, slice]

  - override: lint-rtl
    needs: [lint, lint-xtor]

  # Verilator lint over everything synthesizable, elaborated from a lint top
  # (tests/lint/axi4_lint_rtl.sv: the checker and a slice under each test P).
  # Our own code: held to ZERO findings -- no baseline. A waiver needs a
  # reason written next to it in lint-waivers.yaml.
  - name: lint-top
    uses: std.FileSet
    needs: [suites.test-params]
    with:
      type: systemVerilogSource
      base: tests/lint
      include: [axi4_lint_rtl_p.sv, axi4_lint_rtl.sv]

  - name: lint
    uses: hdllint.Rtl
    needs: [src-rtl, lint-top]
    with:
      top: [axi4_lint_rtl]
      waivers: lint-waivers.yaml

  # The generated transactors (woven-xtor) for the three test P, with their
  # bridges and the behavioural classes (hence --timing: the class side is linted too). Zero findings in
  # this repo's and the generated files; fw-hdl's rv kit is waived by path in
  # lint-waivers-xtor.yaml (it is linted by fw-hdl).
  - name: lint-xtor-top
    uses: std.FileSet
    needs: [fw.proto.axi.woven-xtor, fw.proto.axi.behav-xtor, fw.proto.axi.rules-xtor, suites.test-params]
    with:
      type: systemVerilogSource
      base: tests/lint
      include: [axi4_lint_xtor.sv, axi4_lint_xtor_b2b.sv]

  - name: lint-xtor
    uses: hdllint.Rtl
    needs: [lint-xtor-top]
    with:
      tools: [vlt]
      top: [axi4_lint_xtor]
      args: [--timing]
      fail_on: any
      waivers: lint-waivers-xtor.yaml

  # Every suite in every view: `dfm run tests --tests types`.
  - override: tests
    needs: [suites.types, suites.weave, suites.bundle, suites.rv-pilot,
            suites.xtor, suites.l1, suites.l2, suites.l2-mem,
            suites.rules-teeth, suites.rules-pins]

  # What CI runs on every commit.
  - override: smoke
    needs: [suites.types, suites.l1, suites.rules-pins]

  # Reference IPs behind the class API (tests/ip/flow.yaml).
  - root: ip
    desc: Wrapped reference IPs driven through inserted abstractors; netlist compare; Yosys synth
    needs: [ip.axi-ram, ip.demofull, ip.axi-crossbar, ip.presets]

  # Formal (tests/formal/flow.yaml).
  - root: fv
    desc: Back-to-back formal BMC of the generated manager and subordinate transactor cores
    needs: [formal.bmc]
  - root: fv-prove
    desc: Unbounded proof of the cores' register slice (abc pdr)
    needs: [formal.prove]
  - root: fv-cover
    desc: Reachability of legal AXI4 behaviour under the pin checker's rules
    needs: [formal.checker-cover, formal.cover-b2b]
  - root: fv-teeth
    desc: Planted bugs in the slice, the checker and the generated cores must each fail formal
    needs: [formal.teeth, formal.teeth-gen]
