# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
fragment:
  # Unnamed: tasks live directly under the package (fw.proto.axi.types, ...).
  tasks:
  # AXI4 encodings, beat structs and burst helpers. Synthesizable, fw-hdl-free.
  - export: types
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: types
      include: [axi4_types_pkg.sv]
      incdirs: [.]

  # Passive pin-level protocol checker (assert or assume per side).
  - export: checker
    uses: std.FileSet
    needs: [types]
    with:
      type: systemVerilogSource
      base: checker
      include: [axi4_checker.sv]

  # Manager / subordinate channel cores: per-channel register slices between
  # packed user streams and the AXI4 pins.
  - export: cores
    uses: std.FileSet
    needs: [types]
    with:
      type: systemVerilogSource
      base: cores
      include: [axi4_slice.sv, axi4_mgr_core.sv, axi4_sub_core.sv]

  # Signal-level transactors: the class-facing interface and the manager and
  # subordinate wrappers around the cores. fw-hdl-free.
  - export: xtor-sv
    uses: std.FileSet
    needs: [types, cores]
    with:
      type: systemVerilogSource
      base: xtor
      include: [axi4_xtor_if.sv, axi4_mgr_xtor.sv, axi4_sub_xtor.sv,
                axi4_mon_xtor_if.sv, axi4_mon_xtor.sv]
      incdirs: [.]

  # The class layer: L1 APIs, link types, IMP macros, interface config,
  # scripted endpoints. Built on fw-hdl and its sockets.
  - export: class
    uses: std.FileSet
    needs: [types, fw-hdl.hdl.sv-src]
    with:
      type: systemVerilogSource
      base: class
      include: [fw_proto_axi4_pkg.sv]
      incdirs: [.]

  # The bridges between the class layer and the transactors.
  - export: xtor-class
    uses: std.FileSet
    needs: [class, xtor-sv]
    with:
      type: systemVerilogSource
      base: class
      include: [fw_proto_axi4_xtor_pkg.sv]
      incdirs: [.]

  # ---- New style (docs/design-new-style.md, docs/plan-new-style.md) ----

  # The AXI4 core specification: the only hand-written protocol description, in
  # two packages. `defs`: its synthesizable part (parameters, encodings, burst
  # arithmetic; no classes, so any RTL flow reads it). `core`: the classes
  # (payload structs, port bundle, transaction API).
  - export: defs
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: core
      include: [fw_proto_axi4_defs_pkg.sv]

  - export: core
    uses: std.FileSet
    needs: [fw-proto-sv, defs]
    with:
      type: systemVerilogSource
      base: core
      include: [fw_proto_axi4_core_pkg.sv]

  # Everything derived from the core (bases, listeners, proxies, fan-outs, imps,
  # channel APIs), generated by sv-weave with the fw_proto weavers into
  # fw_proto_axi4_core_pkg_woven. Outputs the core sources, then the woven ones.
  # `dfm run woven`; the generated code and weave-report.md are in its rundir.
  - export: woven
    uses: svweave.Weave
    needs: [core]
    with:
      config: weave/sv-weave.yaml

  # `woven` plus the pin-level transactors (design §4.5, §5): the generated
  # axi4_{mgr,sub,mon}_xtor modules (one fw-hdl rv transactor per channel), their
  # handle interfaces and, in the woven package, their bridges. Needs fw-hdl's rv
  # kit, so it is a separate weave; an image uses `woven` or `woven-xtor`, not both.
  - export: woven-xtor
    uses: svweave.Weave
    needs: [core, fw-hdl.hdl.sv-src, fw-hdl.hdl.rv-src]
    with:
      config: weave/sv-weave-xtor.yaml

  # Behaviour (plan P5): the manager and subordinate adapters, the memory model
  # and fw_mem_if over the transaction API (fw_proto_axi4_behav_pkg). Built on the
  # woven package, so it comes in two forms like it: `behav` over `woven`,
  # `behav-xtor` over `woven-xtor`. fw-hdl for fw_mem_if.
  - export: behav
    uses: std.FileSet
    needs: [woven, fw-hdl.hdl.sv-src]
    with:
      type: systemVerilogSource
      base: behav
      include: [fw_proto_axi4_behav_pkg.sv]

  - export: behav-xtor
    uses: std.FileSet
    needs: [woven-xtor, fw-hdl.hdl.sv-src]
    with:
      type: systemVerilogSource
      base: behav
      include: [fw_proto_axi4_behav_pkg.sv]
