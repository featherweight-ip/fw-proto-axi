package:
  name: fw-proto-axi
  default-dep-set: dev

  dep-sets:
  - name: use
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default
  - name: dev
    uses: use
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      dep-set: default-dev
    # SVUnit suites (hdltest.svunit), formal (formal.sby), lint (hdllint.Rtl)
    - name: dv-flow-libhdltest
      url: https://github.com/dv-flow/dv-flow-libhdltest.git
      dep-set: default-dev
    - name: svunit
      url: https://github.com/svunit/svunit.git
      tag: v3.38.1
      type: raw
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
      dep-set: default-dev
    - name: dv-flow-libhdllint
      url: https://github.com/dv-flow/dv-flow-libhdllint.git
      dep-set: default-dev
    # yosys + sby: the formal suites (fv, fv-prove, fv-cover) and synthesis
    # checks. Also a dependency of fw-hdl; declared here because this package
    # uses it directly. Same entry as fw-hdl's, so one checkout serves both.
    - name: yosys
      url: https://github.com/edapack/yosys-bin
      src: gh-rls
      cache: true
      dep-set: default
    # Generates the package's derived classes (listeners, proxies, bases,
    # channel APIs, bridges) from the core spec. Editable checkout: fixes
    # needed by this package are made in packages/sv-weave on a branch.
    - name: sv-weave
      url: https://github.com/sv-weave/sv-weave.git
      dep-set: use
    # The fw_proto weavers keep their SV text in Jinja templates
    # (fw_proto/python/fw_proto_weave/templates), rendered by sv-weave
    # (its `templates` extra: jinja2>=3.1,<3.2).
    - name: jinja2
      src: pypi
    # Reference IPs for the extern-wrapping tests (tests/ip, plan P6.4). RTL
    # only, read as sources; nothing here builds them.
    - name: verilog-axi
      url: https://github.com/alexforencich/verilog-axi.git
      type: raw
    - name: wb2axip
      url: https://github.com/ZipCPU/wb2axip.git
      type: raw
